[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Change 'localhost' to '127.0.0.1' and ensure your password is correct
sqlalchemy.url = postgresql+asyncpg://postgres:CISSP%%40123@127.0.0.1:5432/core_auth_db



[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S